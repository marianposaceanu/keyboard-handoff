name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Conventional Commits
        run: python3 scripts/check-commits.py --range HEAD
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-commits.py --title "$PR_TITLE"
      - run: scripts/check.sh
      - name: Build the shared scheme
        run: xcodebuild -quiet -project KeyboardHandoff.xcodeproj -scheme KeyboardHandoff -configuration Release -derivedDataPath .build/xcode build
