name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: scripts/check.sh
      - run: scripts/package.sh "$GITHUB_REF_NAME"
      - name: Create draft with checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
            --notes 'Ad hoc signed universal build for macOS 14 or later.' "dist/$GITHUB_REF_NAME/"*
